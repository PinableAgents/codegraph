name: Diagnose PR 2060 conflicts

on:
  push:
    branches: [sync/pr2060-20260928-e63fe2ec]
    paths: [.github/workflows/pinable-pr2060-diagnose.yml]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'PinableAgents/codegraph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORK_SHA: 8e752b21e7a631346df1b539eb4b4dbfaf8e7f84
      UPSTREAM_SHA: e63fe2ec5b927d7c6f802b43649391c756979b31
      CODEGRAPH_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8e752b21e7a631346df1b539eb4b4dbfaf8e7f84
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Reproduce the real three-way merge with the existing sync tool
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORK_SHA"
          git config user.name 'Pinable conflict review'
          git config user.email 'noreply@pinable.cc'
          git switch -c sync/pr2060-resolution
          git remote add upstream https://github.com/colbymchenry/codegraph.git
          git fetch --no-tags upstream "$UPSTREAM_SHA:refs/remotes/upstream/main"
          if ! node scripts/pinable/sync-upstream.mjs --no-fetch > "$RUNNER_TEMP/merge.log" 2>&1; then
            cat "$RUNNER_TEMP/merge.log"
            test -f .git/MERGE_HEAD
            test -n "$(git ls-files -u)"
          fi
          cat "$RUNNER_TEMP/merge.log"
          {
            printf 'Fork: %s\nUpstream: %s\n' "$FORK_SHA" "$UPSTREAM_SHA"
            git merge-base "$FORK_SHA" "$UPSTREAM_SHA"
            git rev-list --left-right --count "$FORK_SHA...$UPSTREAM_SHA"
            git diff --name-only --diff-filter=U
            git ls-files -u
          } > "$RUNNER_TEMP/conflict-report.txt"
          cat "$RUNNER_TEMP/conflict-report.txt" >> "$GITHUB_STEP_SUMMARY"
          tar -czf "$RUNNER_TEMP/codegraph-pr2060-snapshot.tar.gz" --exclude=.git/hooks .
      - uses: actions/upload-artifact@v4
        with:
          name: codegraph-pr2060-conflict-snapshot
          path: |
            ${{ runner.temp }}/codegraph-pr2060-snapshot.tar.gz
            ${{ runner.temp }}/conflict-report.txt
            ${{ runner.temp }}/merge.log
          retention-days: 1
          if-no-files-found: error
