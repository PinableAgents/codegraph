name: Integrate upstream 20260930

on:
  push:
    branches: [maintenance/upstream-20260930-7639c787]
    paths: [.github/workflows/pinable-sync-20260930-integrate.yml]

permissions:
  contents: read

concurrency:
  group: pinable-integrate-20260930
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'PinableAgents/codegraph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head: ${{ steps.push.outputs.head }}
    env:
      FORK_SHA: d01ad7ad7fe5db5d3cc6745f9eb8877efbf6c4fa
      UPSTREAM_SHA: 7639c787e48be92ea4ca83c5c014d8dd480de470
      SYNC_BRANCH: sync/upstream-20260930-7639c787
    steps:
      - uses: actions/checkout@v6
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: source
          ref: d01ad7ad7fe5db5d3cc6745f9eb8877efbf6c4fa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Reproduce and apply only the reviewed merge resolution
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORK_SHA"
          git config user.name 'Pinable upstream sync'
          git config user.email 'noreply@pinable.cc'
          git switch -c "$SYNC_BRANCH"
          git remote add upstream https://github.com/colbymchenry/codegraph.git
          git fetch --no-tags upstream refs/heads/main:refs/remotes/upstream/main
          test "$(git rev-parse upstream/main)" = "$UPSTREAM_SHA"
          if node scripts/pinable/sync-upstream.mjs --no-fetch; then
            echo 'Expected four reviewed conflicts; refusing a different merge.' >&2
            exit 1
          fi
          python3 ../driver/.github/pinable-sync-20260930-resolve.py
          test -z "$(git ls-files -u)"
          test "$(git write-tree)" = '944f5d9fc4f031bd14e311ade870c9bef82ca22e'
          node --test scripts/pinable/sync-upstream.test.mjs
          git commit -m 'Merge upstream 7639c787 with Pinable workbench preserved' -m 'Integrate 31 upstream commits. Resolve dependency metadata, map filtering and compact labels, obsolete XYFlow renderer deletion, and the duplicated daemon readiness fix. Add map/G6 compatibility regressions and document the upstream CODEGRAPH_UI=1 opt-in. Full PR CI remains required before main is updated.'
          test "$(git show -s --format=%P HEAD)" = "$FORK_SHA $UPSTREAM_SHA"
          node scripts/pinable/sync-upstream.mjs --check
          test -z "$(git status --porcelain)"
      - name: Publish isolated source branch, not main
        id: push
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/PinableAgents/codegraph/git/ref/heads/main --jq .object.sha)" = "$FORK_SHA"
          test "$(gh api repos/colbymchenry/codegraph/git/ref/heads/main --jq .object.sha)" = "$UPSTREAM_SHA"
          set +e
          git ls-remote --exit-code --heads origin "$SYNC_BRANCH"
          status=$?
          set -e
          test "$status" -eq 2
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$SYNC_BRANCH"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  focused:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEGRAPH_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify conflict boundaries and retained fork compatibility
        shell: bash
        run: |
          set -euo pipefail
          npm test -- __tests__/ui-workbench-api.test.ts __tests__/ui-map-api.test.ts __tests__/ui-package.test.ts __tests__/migrations-pinable-compat.test.ts __tests__/mcp-daemon.test.ts __tests__/viewer-gate.test.ts __tests__/cli-ui-command.test.ts --maxWorkers=2 --minWorkers=1 2>&1 | tee focused-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinable-upstream-20260930-focused-tests
          path: focused-tests.log
          if-no-files-found: ignore
          retention-days: 7
