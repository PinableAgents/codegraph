name: Upstream 20260930 platform checks

on:
  push:
    branches: [maintenance/upstream-20260930-7639c787]
    paths: [.github/workflows/pinable-sync-20260930-platform.yml]

permissions:
  contents: read

jobs:
  platform:
    if: github.repository == 'PinableAgents/codegraph'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CODEGRAPH_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1fbed73e82b972218c0e9d16105e392dda1302eb
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:lib
      - name: Native database, map, UI, viewer and MCP lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          npm test -- __tests__/migrations-pinable-compat.test.ts __tests__/ui-workbench-api.test.ts __tests__/ui-map-api.test.ts __tests__/ui-package.test.ts __tests__/cli-ui-command.test.ts __tests__/viewer-gate.test.ts __tests__/mcp-daemon.test.ts __tests__/wsl-shared-index.test.ts __tests__/bounded-source.test.ts --maxWorkers=2 --minWorkers=1 2>&1 | tee platform-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-20260930-${{ matrix.os }}-tests
          path: platform-tests.log
          if-no-files-found: ignore
          retention-days: 7
