name: PR 2060 daemon readiness regression

on:
  push:
    branches: [sync/pr2060-20260928-e63fe2ec]
    paths: [.github/workflows/pinable-pr2060-daemon-ready.yml]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'PinableAgents/codegraph'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CODEGRAPH_TELEMETRY: '0'
      REVIEW_SHA: d08dfc41c3c727322be0b03d08199ab975ae90a9
      EXPECTED_TREE: 874358989ee9eea2a48e934f24f1f86aff9d06b2
      FIX_BRANCH: sync/pr2060-daemon-ready-20260928
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d08dfc41c3c727322be0b03d08199ab975ae90a9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Add the real attachment barrier used by the adjacent socket test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          test "$(git rev-parse HEAD:__tests__/mcp-daemon.test.ts)" = eac53516f7361c93c0603904f74d7dd9764d039c
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('__tests__/mcp-daemon.test.ts')
          s = p.read_text()
          anchor = """  it.runIf(process.platform !== 'win32')('stops despite a socket still waiting for its client hello (#1963)', async () => {
              const server = spawnServer(tempDir);
              servers.push(server);
              sendInitialize(server.child, `file://${tempDir}`, 1);
              await waitFor(() => findResponse(server.stdout, 1), 10000);
          """
          extra = """    // The proxy answers initialize locally and the pidfile precedes listen.
              // Wait for an actual daemon handshake before opening the raw client.
              await waitFor(() => server.stderr.some((l) => l.includes('Attached to shared daemon')), 10000);
          """
          assert s.count(anchor) == 1, 'Test fixture changed; review rather than guessing'
          p.write_text(s.replace(anchor, anchor + extra))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '0aa1b093180111ffae5e929ccf8b98a3ee040d03284efc26184025183b4a25a3'
          PY
          git diff --check
          git add __tests__/mcp-daemon.test.ts
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - run: npm ci
      - name: Repeat the real raw-socket shutdown regression twenty times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            printf '\n=== daemon readiness regression %s / 20 ===\n' "$attempt"
            npm test -- __tests__/mcp-daemon.test.ts -t 'stops despite a socket still waiting for its client hello' --maxWorkers=1 --minWorkers=1
          done 2>&1 | tee "$RUNNER_TEMP/daemon-readiness-stress.log"
      - name: Commit and push only the tested child on an isolated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/PinableAgents/codegraph/git/ref/heads/sync/pr2060-resolved-20260928 --jq .object.sha)" = "$REVIEW_SHA"
          git diff --quiet
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git ls-files --others --exclude-standard)"
          git config user.name 'Pinable test regression'
          git config user.email 'noreply@pinable.cc'
          git switch -c "$FIX_BRANCH"
          git commit -m 'test: wait for daemon attachment before connecting a raw client' -m 'The proxy answers initialize before the daemon socket is listening, and daemon.pid is created before listen. Synchronize on the existing attachment signal rather than a guessed sleep. Preserve the real socket test, 1500ms shutdown bound, writer-lock assertion and platform conditions. Verified with 20 repetitions.'
          test "$(git show -s --format=%P HEAD)" = "$REVIEW_SHA"
          if git ls-remote --exit-code --heads origin "$FIX_BRANCH"; then
            echo 'Temporary fix branch already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          git -c credential.helper='!gh auth git-credential' push https://github.com/PinableAgents/codegraph.git "HEAD:refs/heads/$FIX_BRANCH"
          printf 'Test-only fix: `%s`\n\nFull current-head CI remains required before merging.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2060-daemon-readiness-stress-log
          path: ${{ runner.temp }}/daemon-readiness-stress.log
          if-no-files-found: ignore
          retention-days: 7
