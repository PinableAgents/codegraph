name: Prepare upstream 20260930

on:
  push:
    branches: [maintenance/upstream-20260930-7639c787]
    paths: [.github/workflows/pinable-sync-20260930-prepare.yml]

permissions:
  contents: read

concurrency:
  group: pinable-prepare-upstream-20260930
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'PinableAgents/codegraph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      FORK_SHA: d01ad7ad7fe5db5d3cc6745f9eb8877efbf6c4fa
      UPSTREAM_SHA: 7639c787e48be92ea4ca83c5c014d8dd480de470
      SYNC_BRANCH: sync/upstream-20260930-7639c787
      CODEGRAPH_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d01ad7ad7fe5db5d3cc6745f9eb8877efbf6c4fa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Prepare a real three-way merge using the maintained script
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORK_SHA"
          test -z "$(git status --porcelain)"
          git config user.name 'Pinable upstream sync'
          git config user.email 'noreply@pinable.cc'
          git switch -c "$SYNC_BRANCH"
          git remote add upstream https://github.com/colbymchenry/codegraph.git
          git fetch --no-tags upstream refs/heads/main:refs/remotes/upstream/main
          test "$(git rev-parse upstream/main)" = "$UPSTREAM_SHA"
          mkdir -p "$RUNNER_TEMP/review"
          set +e
          node scripts/pinable/sync-upstream.mjs --no-fetch > "$RUNNER_TEMP/review/merge.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/review/merge.log"
          if [ "$status" -eq 0 ]; then
            test -z "$(git ls-files -u)"
            git diff --cached --check
            git commit -m 'Merge upstream 7639c787 into Pinable codegraph for validation' -m 'Retain fork d01ad7ad and upstream ancestry. Prepared by the existing safe sync script; full application and native-kernel CI must pass before main is updated.'
            test "$(git show -s --format=%P HEAD)" = "$FORK_SHA $UPSTREAM_SHA"
            node scripts/pinable/sync-upstream.mjs --check
            node --test scripts/pinable/sync-upstream.test.mjs
            echo 'clean=true' >> "$GITHUB_OUTPUT"
          else
            echo 'clean=false' >> "$GITHUB_OUTPUT"
          fi
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          summary = {'fork': os.environ['FORK_SHA'], 'upstream': os.environ['UPSTREAM_SHA'],
                     'head': git('rev-parse', 'HEAD'), 'status': git('status', '--porcelain'),
                     'conflicts': git('diff', '--name-only', '--diff-filter=U').splitlines()}
          Path(os.environ['RUNNER_TEMP'], 'review', 'summary.json').write_text(json.dumps(summary, indent=2)+'\n')
          print(json.dumps(summary, indent=2))
          PY
          tar -czf "$RUNNER_TEMP/review/source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: codegraph-upstream-20260930-review
          path: ${{ runner.temp }}/review/
          retention-days: 3
      - name: Require a clean merge
        if: steps.merge.outputs.clean != 'true'
        run: |
          echo 'Review the captured conflicts before preparing a source branch.' >&2
          exit 1
      - name: Push only the isolated review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/PinableAgents/codegraph/git/ref/heads/main --jq .object.sha)" = "$FORK_SHA"
          test "$(gh api repos/colbymchenry/codegraph/git/ref/heads/main --jq .object.sha)" = "$UPSTREAM_SHA"
          set +e
          git ls-remote --exit-code --heads origin "$SYNC_BRANCH"
          status=$?
          set -e
          test "$status" -eq 2
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$SYNC_BRANCH"
          printf 'Review branch: %s\nCommit: %s\nMain has not been updated. Full CI is still required.\n' "$SYNC_BRANCH" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
