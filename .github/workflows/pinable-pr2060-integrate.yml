name: Prepare reviewed PR 2060 resolution

on:
  push:
    branches: [sync/pr2060-20260928-e63fe2ec]
    paths: [.github/workflows/pinable-pr2060-integrate.yml]

permissions:
  contents: read

concurrency:
  group: pinable-pr2060-resolution
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'PinableAgents/codegraph'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FORK_SHA: 8e752b21e7a631346df1b539eb4b4dbfaf8e7f84
      UPSTREAM_SHA: e63fe2ec5b927d7c6f802b43649391c756979b31
      CURRENT_MAIN: ee9ed4fd509faacf3d7fd6a2b450bcee0e1a56ba
      EXPECTED_TREE: 1bdb54d12f79157578196063c1129bf49e55f4de
      RESOLUTION_BRANCH: sync/pr2060-resolved-20260928
      CODEGRAPH_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: source
          ref: 8e752b21e7a631346df1b539eb4b4dbfaf8e7f84
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Decode the reviewed patch and verify its digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = Path('driver/.github/pr2060-resolution.patch.gz.b64').read_text().strip()
          encoded = encoded.replace('RRIOExP0R0HTv', 'RRIOExP0RHTv')
          assert len(encoded) == 6964, 'Unexpected patch transport size'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b76edecae2dc08704d7a1ffe93fdf0d6555f7ffead107fbfb42a0dead0fd3543'
          Path(os.environ['RUNNER_TEMP'], 'pr2060-resolution.patch').write_bytes(patch)
          PY
      - name: Reproduce the reviewed tree without changing existing commits
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORK_SHA"
          git config user.name 'Pinable conflict resolution'
          git config user.email 'noreply@pinable.cc'
          git switch -c sync/pr2060-reviewed-merge
          git remote add upstream https://github.com/colbymchenry/codegraph.git
          git fetch --no-tags upstream "$UPSTREAM_SHA:refs/remotes/upstream/main"
          if node scripts/pinable/sync-upstream.mjs --no-fetch; then
            echo 'Expected the three reviewed conflicts, but the merge was different.' >&2
            exit 1
          fi
          test "$(cat .git/MERGE_HEAD)" = "$UPSTREAM_SHA"
          printf '%s\n' __tests__/generated-flag-index.test.ts __tests__/ui-package.test.ts src/db/migrations.ts > "$RUNNER_TEMP/expected-conflicts"
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/actual-conflicts"
          diff -u "$RUNNER_TEMP/expected-conflicts" "$RUNNER_TEMP/actual-conflicts"
          git apply --check "$RUNNER_TEMP/pr2060-resolution.patch"
          git apply "$RUNNER_TEMP/pr2060-resolution.patch"
          git add -- src/db/migrations.ts __tests__/generated-flag-index.test.ts __tests__/ui-package.test.ts ui/src/lib/api.ts __tests__/migrations-pinable-compat.test.ts
          node scripts/pinable/sync-upstream.mjs --finish
          test -z "$(git ls-files -u)"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git commit -m 'Local reviewed PR 2060 merge tree for compatibility comparison'
          reviewed=$(git rev-parse HEAD)
          test "$(git show -s --format=%P HEAD)" = "$FORK_SHA $UPSTREAM_SHA"
          # Another authorized update integrated upstream while review was in
          # progress. Preserve it; add only the four reviewed follow-up files.
          git fetch --no-tags origin "$CURRENT_MAIN"
          test "$(git rev-parse "$CURRENT_MAIN^{tree}")" = b65dba3fa0ac574f0690bb324e52bb0b8cab5bd1
          git merge-base --is-ancestor "$FORK_SHA" "$CURRENT_MAIN"
          git merge-base --is-ancestor "$UPSTREAM_SHA" "$CURRENT_MAIN"
          printf '%s\n' __tests__/migrations-pinable-compat.test.ts __tests__/ui-package.test.ts src/db/migrations.ts ui/src/lib/api.ts > "$RUNNER_TEMP/expected-followup"
          git diff --name-only "$CURRENT_MAIN" "$reviewed" > "$RUNNER_TEMP/actual-followup"
          diff -u "$RUNNER_TEMP/expected-followup" "$RUNNER_TEMP/actual-followup"
          git switch -c "$RESOLUTION_BRANCH" "$CURRENT_MAIN"
          git restore --source="$reviewed" --staged --worktree -- __tests__/migrations-pinable-compat.test.ts __tests__/ui-package.test.ts src/db/migrations.ts ui/src/lib/api.ts
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git commit -m 'fix: retain Pinable database upgrades and UI regressions after PR 2060 merge' -m 'Build on the concurrent upstream merge without rewriting it. Reconcile the legacy Pinable v10 schema with upstream synthesis migrations at v12, retain cursor indexes and both UI test suites, and keep batched trail queries scoped to the originating project. Add real SQLite upgrade/idempotency and adapter-switch regressions.'
          test "$(git show -s --format=%P HEAD)" = "$CURRENT_MAIN"
          node scripts/pinable/sync-upstream.mjs --check
          node --test scripts/pinable/sync-upstream.test.mjs
          test -z "$(git status --porcelain)"
      - name: Publish only the clean review branch, never main
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api repos/PinableAgents/codegraph/git/ref/heads/main --jq .object.sha)
          printf 'Current fork main: %s\n' "$current"
          test "$current" = "$CURRENT_MAIN"
          test "$(gh api repos/colbymchenry/codegraph/git/ref/heads/main --jq .object.sha)" = "$UPSTREAM_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          if git ls-remote --exit-code --heads origin "$RESOLUTION_BRANCH"; then
            echo 'Resolution branch already exists; inspect rather than overwrite it.' >&2
            exit 1
          fi
          git -c credential.helper='!gh auth git-credential' push https://github.com/PinableAgents/codegraph.git "HEAD:refs/heads/$RESOLUTION_BRANCH"
          printf 'Prepared compatibility commit: `%s`\n\nFull application and native-kernel CI must pass before updating the PR source main.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
